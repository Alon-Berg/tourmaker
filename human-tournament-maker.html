<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Human Tournament Maker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23222'/%3E%3Crect x='0' y='0' width='8' height='8' fill='%23484848'/%3E%3Crect x='8' y='8' width='8' height='8' fill='%23484848'/%3E%3Cpath d='M4 3h2v4l3-4h2.2L7.6 7.6 11.4 13H9L6 8.8V13H4z' fill='%23fff'/%3E%3C/svg%3E">
<style>
/* Human Tournament Maker - plain, classic desktop look (in the spirit of Swiss-Manager / SP98 Sevilla): grey window, white panels, thin borders, no colour accents */
:root {
  --bg: #f0f0f0; --panel: #ffffff; --panel2: #f6f6f6; --head: #e4e4e4;
  --line: #9c9c9c; --line2: #d0d0d0; --text: #000000; --muted: #505050; --faint: #808080;
  --sel: #d3e2f4; --hover: #eaf1fa; --pend: #fff7d6;
  --good: #1d5d1d; --bad: #8a1c1c; --warn: #6e5200;
  --font: "Segoe UI", Tahoma, Arial, sans-serif; --mono: Consolas, "Courier New", monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 13px/1.35 var(--font); overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
.hidden { display: none !important; }
.mono { font-family: var(--mono); }
.muted { color: var(--muted); } .faint { color: var(--faint); } .good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); }
.right { text-align: right; } .center { text-align: center; } .nowrap { white-space: nowrap; }
.spacer { flex: 1; }

/* window frame: title line, classic tabs, content */
#app { display: flex; flex-direction: column; height: 100vh; }
.topbar { display: flex; align-items: flex-end; gap: 16px; padding: 6px 10px 0; background: var(--head); border-bottom: 1px solid var(--line); flex: none; flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 14px; padding-bottom: 4px; display: flex; align-items: center; gap: 7px; cursor: default; }
.brand svg { display: block; }
.tabs { display: flex; gap: 2px; flex-wrap: wrap; }
.tab-btn { background: #d6d6d6; border: 1px solid var(--line); border-bottom: 0; padding: 4px 16px; cursor: pointer; position: relative; top: 1px; }
.tab-btn:hover { background: #e6e6e6; } .tab-btn.active { background: var(--bg); font-weight: 600; padding-bottom: 5px; }
.top-tools { display: flex; gap: 4px; align-items: center; padding-bottom: 4px; flex-wrap: wrap; }
#top-status { color: var(--muted); padding-bottom: 6px; font-size: 12px; }
main { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 10px; position: relative; }

/* controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: #e1e1e1; border: 1px solid #adadad; color: var(--text); padding: 2px 12px; cursor: pointer; white-space: nowrap; min-height: 23px; }
.btn:hover { background: var(--hover); border-color: #707070; } .btn:active { background: #d3e2f4; }
.btn.primary { font-weight: 700; border-color: #333; } .btn.ghost { background: transparent; border-color: transparent; } .btn.ghost:hover { background: var(--hover); border-color: #adadad; }
.btn.sm { padding: 0 8px; min-height: 21px; font-size: 12.5px; } .btn.lg { padding: 4px 20px; min-height: 28px; }
.btn[disabled] { color: #8a8a8a; border-color: #c4c4c4; background: #efefef; pointer-events: none; }
.input, .select, textarea.input { background: #fff; border: 1px solid #7a7a7a; padding: 2px 5px; min-width: 0; width: 100%; outline: none; min-height: 23px; }
.input:focus, .select:focus, textarea.input:focus { border-color: #000; }
.input.num { width: 78px; text-align: right; font-family: var(--mono); }
.input.sm { width: 64px; } .select { padding: 1px 3px; }
.select.auto, .input.auto { width: auto; }
textarea.input { resize: vertical; font-family: var(--mono); }
input[type=checkbox] { margin: 0; width: 14px; height: 14px; cursor: pointer; }
label.check { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
.chip { display: inline-flex; align-items: center; padding: 0 9px; background: #e1e1e1; border: 1px solid #adadad; cursor: pointer; font-size: 12.5px; user-select: none; min-height: 23px; }
.chip:hover { background: var(--hover); border-color: #707070; } .chip.on { background: #fff; border-color: #000; font-weight: 700; } .chip.done { color: var(--good); } .chip.off { color: var(--faint); }
.badge { display: inline-block; padding: 0 5px; font-size: 12px; background: #f2f2f2; border: 1px solid #b4b4b4; color: #333; }
.seg { display: inline-flex; background: #e1e1e1; border: 1px solid #adadad; }
.seg button { background: none; border: 0; padding: 2px 12px; cursor: pointer; min-height: 21px; } .seg button:hover { background: var(--hover); } .seg button.on { background: #fff; font-weight: 600; box-shadow: inset 0 0 0 1px #555; }

/* panels */
.card { background: var(--panel); border: 1px solid var(--line); padding: 8px 10px; }
.card + .card { margin-top: 10px; }
.card > h3, .card .h { margin: 0 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--line2); font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.grid2 { display: grid; grid-template-columns: minmax(320px, 1fr) minmax(320px, 1fr); gap: 10px; align-items: start; }
.field { display: grid; grid-template-columns: 150px 1fr; gap: 4px 10px; align-items: center; margin: 5px 0; }
.field > label { color: var(--text); }
.field .inline { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.hr { height: 1px; background: var(--line2); margin: 8px 0; }
.help { color: var(--muted); font-size: 12px; margin-top: 3px; }
.row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.toolbar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.msg { padding: 5px 8px; border: 1px solid var(--line); background: var(--panel2); margin: 0 0 8px; }
.msg.warn { background: var(--pend); border-color: #b59a2a; } .msg.err { color: var(--bad); border-color: var(--bad); background: #fff; }

/* tables as plain grids */
.tbl { border-collapse: collapse; font-size: 13px; background: #fff; }
.tbl.full { width: 100%; }
.tbl th { text-align: left; padding: 2px 6px; border: 1px solid #b8b8b8; position: sticky; top: -10px; background: #e4e4e4; z-index: 1; font-weight: 600; white-space: nowrap; }
.tbl td { padding: 1px 6px; border: 1px solid var(--line2); white-space: nowrap; }
.tbl tbody tr:nth-child(even) td { background: #f7f7f7; }
.tbl tbody tr:hover td { background: var(--hover) !important; } .tbl tr.sel td { background: var(--sel) !important; }
.tbl tr.pend td { background: var(--pend) !important; }
.tbl tr.off td { color: var(--faint); }
.tbl .r { text-align: right; } .tbl .c { text-align: center; }
.tbl.click tbody tr { cursor: pointer; }
.tbl td.name { min-width: 150px; } .tbl td.sep { border-left: 2px solid #777; }
.tbl input.cell, .tbl select.cell { border: 1px solid transparent; background: transparent; width: 100%; padding: 1px 3px; min-height: 21px; }
.tbl input.cell:hover, .tbl select.cell:hover { border-color: #b8b8b8; background: #fff; } .tbl input.cell:focus, .tbl select.cell:focus { border-color: #000; background: #fff; outline: none; }
.tbl td.in { padding: 0; }
.tbl .tag { font-size: 11.5px; color: var(--muted); }
.board-tbl td.pl { min-width: 190px; } .board-tbl td.res { width: 110px; padding: 0; } .board-tbl select.cell { text-align: center; }
.board-tbl tr:focus { outline: 2px solid #000; outline-offset: -2px; }
.xt td, .xt th { text-align: center; min-width: 32px; padding: 1px 4px; font-size: 12px; }
.xt td.self { background: #cfcfcf !important; } .xt td.nm { text-align: left; white-space: nowrap; min-width: 150px; font-size: 13px; }
.scroll { overflow: auto; }

/* knockout bracket */
.bracket { display: flex; gap: 22px; align-items: stretch; overflow: auto; padding-bottom: 8px; }
.bracket .rnd { display: flex; flex-direction: column; justify-content: space-around; gap: 10px; min-width: 210px; }
.bracket .rnd h4 { margin: 0 0 4px; font-size: 12.5px; color: var(--muted); font-weight: 600; text-align: center; }
.bracket .match { background: #fff; border: 1px solid #888; cursor: pointer; } .bracket .match:hover { background: var(--hover); }
.bracket .match div { display: flex; justify-content: space-between; gap: 8px; padding: 2px 6px; min-height: 22px; } .bracket .match div.win { font-weight: 700; background: #ececec; } .bracket .match div + div { border-top: 1px solid var(--line2); }
.bracket .match .seed { color: var(--faint); width: 22px; flex: none; }
.bracket .match .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bracket .match .gm { font-size: 11.5px; color: var(--muted); padding: 1px 6px; border-top: 1px solid var(--line2); min-height: 0; }

/* misc */
.empty { text-align: center; color: var(--muted); padding: 26px 10px; }
.empty b { display: block; color: var(--text); font-size: 14px; margin-bottom: 4px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; } .kv dt { color: var(--muted); } .kv dd { margin: 0; }
#toast-root { position: fixed; right: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 6px; z-index: 100; }
.toast { background: #fff; border: 1px solid #555; padding: 6px 10px; max-width: 420px; box-shadow: 2px 2px 0 rgba(0, 0, 0, .25); } .toast.err { color: var(--bad); border-color: var(--bad); }
.modal-back { position: fixed; inset: 0; background: rgba(0, 0, 0, .35); display: flex; align-items: center; justify-content: center; z-index: 90; padding: 20px; }
.modal { background: var(--bg); border: 1px solid #555; box-shadow: 3px 3px 0 rgba(0, 0, 0, .3); width: min(720px, 100%); max-height: 92vh; display: flex; flex-direction: column; }
.modal > header { padding: 5px 10px; font-weight: 700; background: var(--head); border-bottom: 1px solid var(--line); display: flex; align-items: center; }
.modal > .body { padding: 10px; overflow: auto; background: var(--panel); margin: 8px; border: 1px solid var(--line2); }
.modal > footer { padding: 0 8px 8px; display: flex; gap: 6px; justify-content: flex-end; }
.print-only { display: none; }
#drop { position: fixed; inset: 0; background: rgba(255, 255, 255, .85); border: 3px dashed #555; display: none; align-items: center; justify-content: center; font-size: 20px; z-index: 120; }
body.dragging #drop { display: flex; }

@media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } .field { grid-template-columns: 1fr; } }

/* printing: only the content, as plain black on white */
@media print {
  html, body { height: auto; overflow: visible; background: #fff; }
  #app { height: auto; } .topbar, .toolbar, .noprint, #toast-root, #drop { display: none !important; }
  main { overflow: visible; padding: 0; } .print-only { display: block; margin: 0 0 8px; }
  .print-only h1 { font-size: 16pt; margin: 0; } .print-only p { margin: 2px 0; color: #000; }
  .card { border: 0; padding: 0; } .card > h3, .card .h { border-bottom: 1px solid #000; }
  .tbl th { position: static; background: #fff; border-color: #000; } .tbl td { border-color: #555; } .tbl tbody tr:nth-child(even) td { background: #fff; } .tbl tr.pend td { background: #fff !important; }
  .tbl input.cell, .tbl select.cell { border: 0; background: transparent; appearance: none; -webkit-appearance: none; }
  body { font-size: 11pt; } .tbl { font-size: 10.5pt; } .tbl th { white-space: normal; }
  @page { margin: 12mm; }
}
</style>
</head>
<body>
<div id="app">
  <header class="topbar" id="topbar"></header>
  <main id="main"></main>
</div>
<div id="toast-root"></div>
<div id="modal-root"></div>
<div id="drop">Drop a tournament file here</div>
<script>
/* Human Tournament Maker - core: data model, scoring, standings and tie-breaks.
   Pure logic, no DOM. Loaded as a classic script in the browser and imported by the tests (Deno). */
(function (root) {
  'use strict';
  const HTM = root.HTM = root.HTM || {};
  const EPS = 1e-9;

  HTM.VERSION = 1;
  HTM.FORMATS = { swiss: 'Swiss system', roundrobin: 'Round robin', knockout: 'Knockout' };
  HTM.RESULTS = ['1-0', '1/2', '0-1', '+-', '-+', '--'];                       // 1/2 = draw; +- / -+ = forfeit win for White / Black; -- = both lose
  HTM.RESULT_LABEL = { '1-0': '1 - 0', '1/2': '½ - ½', '0-1': '0 - 1', '+-': '+ : -', '-+': '- : +', '--': '- : -' };
  HTM.TITLES = ['', 'GM', 'IM', 'FM', 'CM', 'WGM', 'WIM', 'WFM', 'WCM'];
  HTM.TITLE_ORDER = { GM: 1, IM: 2, WGM: 3, FM: 4, WIM: 5, CM: 6, WFM: 7, WCM: 8, '': 9 };
  HTM.BYE_LABEL = { pab: 'Bye', half: 'Half-point bye', zero: 'Zero-point bye', full: 'Full-point bye', rest: 'Rest' };

  HTM.TIEBREAKS = [
    { id: 'de', short: 'DE', name: 'Direct encounter', hint: 'Points scored between the tied players (used only when they all met each other)' },
    { id: 'wins', short: 'Wins', name: 'Number of wins', hint: 'Games won over the board' },
    { id: 'blackwins', short: 'BWins', name: 'Wins with Black', hint: 'Games won with the black pieces' },
    { id: 'blackgames', short: 'BGames', name: 'Games with Black', hint: 'More games with Black ranks higher' },
    { id: 'buchholz', short: 'Bch', name: 'Buchholz', hint: 'Sum of the scores of the opponents' },
    { id: 'buchholz1', short: 'Bch-1', name: 'Buchholz Cut 1', hint: 'Buchholz without the lowest opponent score' },
    { id: 'buchholz2', short: 'Bch-2', name: 'Buchholz Cut 2', hint: 'Buchholz without the two lowest opponent scores' },
    { id: 'median1', short: 'Med', name: 'Median Buchholz', hint: 'Buchholz without the highest and the lowest opponent score' },
    { id: 'median2', short: 'Med-2', name: 'Median Buchholz 2', hint: 'Buchholz without the two highest and the two lowest opponent scores' },
    { id: 'sb', short: 'SB', name: 'Sonneborn-Berger', hint: 'Scores of the beaten opponents plus half of the scores of the drawn ones' },
    { id: 'ps', short: 'Prog', name: 'Progressive score', hint: 'Sum of the running scores after each round' },
    { id: 'koya', short: 'Koya', name: 'Koya system', hint: 'Points against opponents who scored at least 50%' },
    { id: 'aro', short: 'ARO', name: 'Average rating of opponents', hint: 'Average rating of the rated opponents met over the board' },
    { id: 'tpr', short: 'TPR', name: 'Performance rating', hint: 'FIDE performance rating over the board' },
    { id: 'rating', short: 'Rtg', name: 'Rating', hint: 'Higher rating first' },
  ];
  HTM.TB = {}; HTM.TIEBREAKS.forEach((t) => { HTM.TB[t.id] = t; });

  HTM.uid = (p) => (p || 'x') + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  HTM.clone = (o) => JSON.parse(JSON.stringify(o));
  HTM.isNum = (x) => typeof x === 'number' && isFinite(x);

  HTM.defaultOpts = function (format) {
    return {
      rounds: format === 'swiss' ? 5 : 0,              // planned rounds (Swiss); the others derive it
      doubleRR: false,                                 // round robin: every pair meets twice
      firstColor: 'white',                             // colour of the top seed on board 1 in round 1
      win: 1, draw: 0.5, loss: 0,                      // points per game
      forfeitWin: 1,                                   // points for a win by forfeit
      pab: 1, halfBye: 0.5, zeroBye: 0, fullBye: 1,    // points for byes
      tiebreaks: format === 'roundrobin' ? ['sb', 'de', 'wins'] : ['buchholz1', 'buchholz', 'sb', 'wins'],
      koGames: 2,                                      // games per knockout match
      showTitle: true, showRating: true, showFed: false, showClub: true,
    };
  };

  HTM.newTournament = function (init) {
    init = init || {};
    const fmt = init.format || 'swiss';
    const now = new Date().toISOString();
    const T = {
      v: HTM.VERSION, id: HTM.uid('t'), created: now, modified: now,
      name: init.name || 'New tournament', city: init.city || '', organizer: init.organizer || '', arbiter: init.arbiter || '',
      startDate: init.startDate || '', endDate: init.endDate || '', timeControl: init.timeControl || '', notes: init.notes || '',
      format: fmt, opts: HTM.defaultOpts(fmt), players: [], nextPlayerId: 1, rounds: [], ko: null, started: false,
    };
    if (init.rounds) T.opts.rounds = init.rounds;
    return T;
  };

  // ------------------------------------------------------------------------------------------------ players
  HTM.newPlayer = function (T, f) {
    f = f || {};
    const p = {
      id: T.nextPlayerId++, no: 0, name: (f.name || '').trim(), title: f.title || '', rating: HTM.isNum(+f.rating) && +f.rating > 0 ? Math.round(+f.rating) : 0,
      fed: (f.fed || '').trim(), club: (f.club || '').trim(), withdrawn: null, byes: {},
    };
    return p;
  };
  HTM.addPlayer = function (T, f) {
    const p = HTM.newPlayer(T, f);
    p.no = T.players.reduce((m, q) => Math.max(m, q.no), 0) + 1;
    T.players.push(p);
    return p;
  };
  HTM.addLatePlayer = function (T, f, kind) {          // Swiss: a player who joins after round 1 gets a bye (kind: 'zero' or 'half') for each round already paired
    const p = HTM.addPlayer(T, f);
    for (const rd of T.rounds) rd.byes.push({ p: p.id, kind });
    return p;
  };
  HTM.playerMap = (T) => new Map(T.players.map((p) => [p.id, p]));
  HTM.renumber = function (T) { T.players.sort((a, b) => a.no - b.no); T.players.forEach((p, i) => { p.no = i + 1; }); };
  HTM.sortByRating = function (T) {                    // starting ranks by rating, then title, then name (only before the first round)
    T.players.sort((a, b) => (b.rating - a.rating) || ((HTM.TITLE_ORDER[a.title] || 9) - (HTM.TITLE_ORDER[b.title] || 9)) || a.name.localeCompare(b.name) || a.id - b.id);
    T.players.forEach((p, i) => { p.no = i + 1; });
  };
  HTM.removePlayer = function (T, id) { T.players = T.players.filter((p) => p.id !== id); HTM.renumber(T); };
  HTM.playersByNo = (T) => T.players.slice().sort((a, b) => a.no - b.no);
  HTM.isActive = (p, r) => p.withdrawn === null || p.withdrawn === undefined || r < p.withdrawn;      // withdrawn = first round the player does not play
  HTM.plannedRounds = function (T) {
    const n = T.players.length;
    if (T.format === 'roundrobin') return n < 2 ? 0 : (n % 2 ? n : n - 1) * (T.opts.doubleRR ? 2 : 1);
    if (T.format === 'knockout') { let r = 0, s = 1; while (s < n) { s *= 2; r++; } return r; }
    return T.opts.rounds || 0;
  };

  // ------------------------------------------------------------------------------------------------ scoring
  HTM.byePoints = function (O, kind) {
    switch (kind) {
      case 'pab': return O.pab; case 'half': return O.halfBye; case 'zero': return O.zeroBye; case 'full': return O.fullBye; default: return 0;
    }
  };
  function comp(O, x) {                                // the result of the virtual opponent of an unplayed game
    if (Math.abs(x - O.win) < EPS) return O.loss;
    if (Math.abs(x - O.loss) < EPS) return O.win;
    if (Math.abs(x - O.draw) < EPS) return O.draw;
    return O.win + O.loss - x;
  }

  // One entry per player and round: what happened to the player in that round.
  // kind: game | forfeitWin | forfeitLoss | doubleForfeit | pending | pab | half | zero | full | rest | absent
  HTM.playerEntries = function (T, upto) {
    const O = T.opts;
    const map = new Map(); T.players.forEach((p) => map.set(p.id, []));
    const R = Math.max(0, Math.min(upto == null ? T.rounds.length : upto, T.rounds.length));
    for (let r = 1; r <= R; r++) {
      const rd = T.rounds[r - 1];
      const seen = new Set();
      for (const g of rd.games) {
        const w = { r, opp: g.b, color: 'w', kind: 'pending', pts: 0, frac: 0, out: null };
        const b = { r, opp: g.w, color: 'b', kind: 'pending', pts: 0, frac: 0, out: null };
        switch (g.res) {
          case '1-0': w.kind = b.kind = 'game'; w.pts = O.win; b.pts = O.loss; w.out = 'W'; b.out = 'L'; w.frac = 1; break;
          case '0-1': w.kind = b.kind = 'game'; w.pts = O.loss; b.pts = O.win; w.out = 'L'; b.out = 'W'; b.frac = 1; break;
          case '1/2': w.kind = b.kind = 'game'; w.pts = b.pts = O.draw; w.out = b.out = 'D'; w.frac = b.frac = 0.5; break;
          case '+-': w.kind = 'forfeitWin'; b.kind = 'forfeitLoss'; w.pts = O.forfeitWin; b.pts = O.loss; w.out = 'W'; b.out = 'L'; w.frac = 1; break;
          case '-+': w.kind = 'forfeitLoss'; b.kind = 'forfeitWin'; w.pts = O.loss; b.pts = O.forfeitWin; w.out = 'L'; b.out = 'W'; b.frac = 1; break;
          case '--': w.kind = b.kind = 'doubleForfeit'; w.pts = b.pts = O.loss; w.out = b.out = 'L'; break;
          default: break;
        }
        if (map.has(g.w)) { map.get(g.w).push(w); seen.add(g.w); }
        if (map.has(g.b)) { map.get(g.b).push(b); seen.add(g.b); }
      }
      for (const bye of rd.byes || []) {
        if (!map.has(bye.p)) continue;
        const pts = HTM.byePoints(O, bye.kind);
        const frac = bye.kind === 'pab' || bye.kind === 'full' ? 1 : bye.kind === 'half' ? 0.5 : 0;
        map.get(bye.p).push({ r, opp: null, color: null, kind: bye.kind, pts, frac, out: frac === 1 ? 'W' : frac === 0.5 ? 'D' : 'L' });
        seen.add(bye.p);
      }
      for (const p of T.players) if (!seen.has(p.id)) map.get(p.id).push({ r, opp: null, color: null, kind: 'absent', pts: 0, frac: 0, out: 'L' });
    }
    return map;
  };

  // ------------------------------------------------------------------------------------------------ performance rating
  const DP = [0, 7, 14, 21, 29, 36, 43, 50, 57, 65, 72, 80, 87, 95, 102, 110, 117, 125, 133, 141, 149, 158, 166, 175, 184, 193, 202, 211, 220, 230, 240, 251, 262, 273, 284, 296, 309, 322, 336, 351, 366, 383, 401, 422, 444, 470, 501, 538, 589, 677, 800];

    top.append(h('div', { class: 'brand', title: 'All tournaments', style: { cursor: 'pointer' }, onclick: () => App.home() }, logo(), 'Human Tournament Maker'));
    if (!S.T) return;
    const T = S.T;
    const tabs = [['players', 'Players'], ['pairings', T.format === 'knockout' ? 'Bracket' : 'Pairings'], ['standings', 'Standings']];
    if (T.format === 'roundrobin') tabs.push(['cross', 'Cross table']);
    tabs.push(['settings', 'Settings']);
    top.append(h('nav', { class: 'tabs' }, tabs.map(([k, l]) => h('button', { class: 'tab-btn' + (S.view === k ? ' active' : ''), onclick: () => App.go(k) }, l))));
    top.append(h('div', { class: 'spacer' }), h('div', { id: 'top-status', title: T.name }),
      h('div', { class: 'top-tools' },
        h('button', { class: 'btn sm', disabled: !S.undo.length, title: 'Undo (Ctrl+Z)', onclick: () => App.undo() }, 'Undo'),
        h('button', { class: 'btn sm', disabled: !S.redo.length, title: 'Redo (Ctrl+Y)', onclick: () => App.redo() }, 'Redo'),
        h('button', { class: 'btn sm', onclick: () => App.exportFile(T.id) }, 'Save file'),
        h('button', { class: 'btn sm', onclick: () => App.home() }, 'Tournaments')));
    updateStatus();
  }
  App.refreshTop = renderTop;
  App.refreshTabs = function () {                                  // after a result was typed: refresh the round marks without redrawing the table
    const T = S.T;
    if (!T || S.view !== 'pairings') return;
    UI.$$('.toolbar .chip').forEach((c, i) => { const r = i + 1, done = r <= T.rounds.length && HTM.roundComplete(T, r); c.classList.toggle('done', done); c.textContent = r + (done ? ' ✓' : ''); });
  };
  App.render = function () {
    const main = UI.$('#main');
    const keep = S.lastView === S.view && S.T ? main.scrollTop : 0;
    renderTop();
    clear(main);
    try { main.append(S.T ? (window.Views[S.view] || window.Views.players)() : window.Views.home()); } catch (e) { console.error(e); main.append(h('div', { class: 'msg err' }, 'Something went wrong while drawing this screen: ' + e.message)); }
    S.lastView = S.view;
    main.scrollTop = keep;
    document.title = (S.T ? S.T.name + ' - ' : '') + 'Human Tournament Maker';
    if (S.focusSel) { const el = UI.$(S.focusSel); if (el) el.focus(); S.focusSel = null; }
  };

  // ---------------------------------------------------------------------------------------------- keyboard, drag and drop, start
  document.addEventListener('keydown', (e) => {
    const t = e.target, tag = t && t.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || document.querySelector('.modal-back')) return;
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'z') { e.preventDefault(); App.undo(); }
    else if ((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === 'y' || (e.shiftKey && e.key.toLowerCase() === 'z'))) { e.preventDefault(); App.redo(); }
  });
  let dragDepth = 0;
  window.addEventListener('dragenter', (e) => { if (e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files')) { dragDepth++; document.body.classList.add('dragging'); } });
  window.addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) document.body.classList.remove('dragging'); });
  window.addEventListener('dragover', (e) => { if (document.body.classList.contains('dragging')) e.preventDefault(); });
  window.addEventListener('drop', async (e) => {
    dragDepth = 0; document.body.classList.remove('dragging');
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (!f) return;
    e.preventDefault();
    try { App.importText(await UI.readFile(f)); } catch (err) { toast(err.message, 'err'); }
  });

  loadIndex();
  const cur = UI.store.get('htm.cur');
  if (cur && S.index.some((x) => x.id === cur)) App.openTournament(cur); else App.render();
})();
</script>
</body>
</html>
